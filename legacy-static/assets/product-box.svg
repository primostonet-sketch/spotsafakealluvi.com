<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="100%" height="auto">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#c9d0da"/>
    </linearGradient>
    <linearGradient id="ampGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e6ea"/>
    </linearGradient>
    <pattern id="molecule" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <g fill="none" stroke="#8a95a6" stroke-width="1" opacity="0.35">
        <polygon points="20,5 35,14 35,32 20,41 5,32 5,14"/>
        <circle cx="20" cy="5" r="2"/>
        <circle cx="35" cy="14" r="2"/>
        <circle cx="35" cy="32" r="2"/>
        <circle cx="20" cy="41" r="2"/>
        <circle cx="5" cy="32" r="2"/>
        <circle cx="5" cy="14" r="2"/>
        <line x1="35" y1="23" x2="60" y2="23"/>
        <circle cx="60" cy="23" r="2"/>
      </g>
    </pattern>
    <clipPath id="boxClip">
      <rect x="20" y="20" width="600" height="230" rx="10"/>
    </clipPath>
  </defs>

  <!-- ============ BOX ============ -->
  <g transform="skewY(-3)">
    <rect x="20" y="20" width="600" height="230" rx="10" fill="url(#boxGrad)" stroke="#1a0f06" stroke-width="2"/>
    <rect x="20" y="20" width="600" height="230" rx="10" fill="url(#molecule)" clip-path="url(#boxClip)"/>

    <!-- product name -->
    <text x="45" y="70" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#241a12">RETATRUTIDE</text>
    <text x="45" y="90" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#4a4038" letter-spacing="0.5">TRIPLE AGONIST OF GLP-1, GIP</text>
    <text x="45" y="103" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#4a4038" letter-spacing="0.5">AND GLUCAGON RECEPTORS</text>

    <!-- brand lockup -->
    <text x="45" y="145" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#e04a1e">ALLUVI</text>
    <text x="45" y="160" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#241a12" letter-spacing="2">HEALTHCARE</text>

    <!-- certified seal -->
    <g transform="translate(430,80)">
      <circle r="30" fill="#e04a1e"/>
      <circle r="30" fill="none" stroke="#f5cba2" stroke-width="1.5" stroke-dasharray="2 2"/>
      <text x="0" y="-6" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="800" fill="#fff">ALLUVI</text>
      <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#fff">MANUFACTURING</text>
      <text x="0" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#fff">PRACTICE CERTIFIED</text>
      <text x="0" y="21" font-family="Arial, sans-serif" font-size="7" fill="#f5cba2">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
    </g>

    <!-- dose badge -->
    <rect x="520" y="150" width="70" height="34" rx="6" fill="#e04a1e"/>
    <text x="555" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#fff">40mg</text>

    <!-- ampoule window -->
    <rect x="480" y="25" width="130" height="46" rx="4" fill="#dfe3e8" stroke="#9aa3b0" stroke-width="1"/>
    <rect x="490" y="32" width="110" height="32" rx="4" fill="url(#ampGrad)" stroke="#1a0f06" stroke-width="1.5"/>
    <rect x="490" y="32" width="18" height="32" rx="3" fill="#c0392b"/>
    <text x="512" y="45" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#1a0f06">ALLUVI</text>
    <text x="512" y="53" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#c0392b">RETATRUTIDE</text>
    <rect x="558" y="42" width="14" height="14" fill="#8dd0c8"/>

    <!-- footer info line -->
    <text x="45" y="230" font-family="Arial, sans-serif" font-size="8" fill="#3a3128">Store in a refrigerator (2&#176;C to 8&#176;C)</text>
    <text x="45" y="241" font-family="Arial, sans-serif" font-size="8" fill="#3a3128">For subcutaneous injection only &#8226; Read package leaflet before use</text>

    <!-- authenticity seal strip bottom -->
    <rect x="330" y="220" width="150" height="16" fill="#e04a1e" opacity="0.9"/>
    <text x="335" y="231" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#fff">ALLUVI AUTHENTICITY SEAL &#8226; DO NOT ACCEPT IF OPENED</text>

    <text x="560" y="240" font-family="Arial, sans-serif" font-size="10" font-weight="800" fill="#e04a1e" text-anchor="end">ALLUVI</text>
  </g>

  <!-- ============ PEN ============ -->
  <g transform="translate(20,300)">
    <rect x="0" y="10" width="260" height="42" rx="21" fill="#f2f4f6" stroke="#1a0f06" stroke-width="2"/>
    <rect x="0" y="10" width="70" height="42" rx="21" fill="#dfe3e8" stroke="#1a0f06" stroke-width="2"/>
    <rect x="60" y="10" width="8" height="42" fill="#7fd0c6"/>
    <text x="24" y="37" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#1a0f06">ALLUVI</text>
    <rect x="80" y="18" width="120" height="26" rx="3" fill="#fff" stroke="#c0392b" stroke-width="1"/>
    <text x="87" y="30" font-family="Arial, sans-serif" font-size="9" font-weight="800" fill="#c0392b">ALLUVI</text>
    <text x="87" y="40" font-family="Arial, sans-serif" font-size="7" fill="#3a3128">RETATRUTIDE 10mg</text>
    <circle cx="238" cy="31" r="19" fill="#e9edf1" stroke="#1a0f06" stroke-width="2"/>
    <text x="238" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#1a0f06">10</text>
    <rect x="255" y="18" width="10" height="26" rx="4" fill="#7fd0c6"/>
  </g>

  <!-- ============ NEEDLE ============ -->
  <g transform="translate(330,290)">
    <polygon points="0,15 90,0 90,60 0,45" fill="#e0692e"/>
    <text x="14" y="34" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" transform="skewY(-4)">ALLUVI</text>
    <rect x="90" y="14" width="55" height="32" rx="4" fill="#eef1f5" stroke="#1a0f06" stroke-width="1.5"/>
    <rect x="145" y="22" width="45" height="16" fill="#c9d0da" stroke="#1a0f06" stroke-width="1"/>
  </g>
</svg>
